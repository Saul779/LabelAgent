services:
  kafka:
    image: apache/kafka:3.7.2
    environment:
      CLUSTER_ID: MkU3OEVBNTcwNTJENDM2Qk
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: controller,broker
      KAFKA_LISTENERS: INTERNAL://:29092,EXTERNAL://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:29092,EXTERNAL://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
    ports: ["9092:9092"]

  kafdrop:
    image: obsidiandynamics/kafdrop:latest
    ports: [ "9002:9000" ]          # 宿主机 9000 被 minio 占了，所以用 9002
    environment:
      KAFKA_BROKERCONNECT: kafka:29092
      JVM_OPTS: "-Xms32M -Xmx64M"
    depends_on: [ kafka ]

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports: ["9000:9000", "9001:9001"]
    volumes: ["./.data/minio:/data"]

  # Milvus 代理与配置中心在本地联调环境中使用 Mock 实现（见 infrastructure/milvus_proxy、config_center），
  # 不在 compose 中拉起真实 Milvus 集群，避免本地资源占用过大。

  api:
    build:
      context: ..
      dockerfile: Dockerfile
    env_file: ../.env
    environment:
      ENTRYPOINT_MODE: api
      MQ_BACKEND: kafka
      MQ_BOOTSTRAP_SERVERS: kafka:29092
    command: ["--mode", "api"]
    ports: ["8000:8000"]
    depends_on: [kafka, minio]

  job-worker:
    build:
      context: ..
      dockerfile: Dockerfile
    env_file: ../.env
    environment:
      MQ_BACKEND: kafka
      MQ_BOOTSTRAP_SERVERS: kafka:29092
    command: ["--mode", "job_worker"]
    depends_on: [kafka, minio]

  # vector-worker / reconciliation-worker 已实现，但依赖真实 Tag Service 与 Milvus 代理；
  # 本地 mock 编排不启动，生产参考见 docker-compose.prod.yml。
