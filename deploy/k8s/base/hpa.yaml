# JobWorker 按 CPU 扩缩容；VectorWorker 通常保持低副本。
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: label-agent-job-worker-hpa
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: label-agent-job-worker
  minReplicas: 3
  maxReplicas: 20
  metrics:
    - type: Resource
      resource:
        name: cpu
        target: { type: Utilization, averageUtilization: 70 }
