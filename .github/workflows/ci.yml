name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  lint-and-test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: 安装 Poetry
        run: pipx install poetry

      - name: 安装依赖
        run: poetry install --no-interaction

      - name: Lint (ruff)
        run: poetry run ruff check src tests

      - name: 格式检查 (black --check)
        run: poetry run black --check src tests

      - name: 类型检查 (mypy)
        run: poetry run mypy src

      - name: 单元测试 + 契约测试
        env:
          APP_ENV: dev
          MQ_BOOTSTRAP_SERVERS: localhost:9092
          MQ_CONSUMER_GROUP: ci-consumer
          MQ_INGRESS_TOPIC: agent.task.ingress
          MQ_CALLBACK_TOPIC_WHITELIST: agent.task.callback
          TAG_SERVICE_BASE_URL: http://localhost:8081
          MILVUS_PROXY_BASE_URL: http://localhost:8082
          OBJECT_STORAGE_ENDPOINT: http://localhost:9000
          OBJECT_STORAGE_BUCKET: label-agent-media
          CONFIG_CENTER_BASE_URL: http://localhost:8090
        run: poetry run pytest tests/unit tests/contract

      - name: 上传覆盖率报告
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: htmlcov
        if: always()

  docker-build:
    runs-on: ubuntu-latest
    needs: lint-and-test
    steps:
      - uses: actions/checkout@v4
      - name: 构建镜像（仅验证可构建，不推送）
        run: docker build -t label-agent:ci .
