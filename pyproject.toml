[tool.poetry]
name = "label-agent"
version = "0.1.0"
description = "AI Agent 运行时：消费 MQ 触发的打标/信息提取任务（S3/S4/T1/S1/S2），产出分类、标签与结构化字段"
authors = ["Label Agent Team"]
readme = "README.md"
packages = [{ include = "label_agent", from = "src" }]

[tool.poetry.dependencies]
python = "^3.10"
pydantic = "^2.7"
pydantic-settings = "^2.2"
fastapi = "^0.111"
uvicorn = { extras = ["standard"], version = "^0.29" }
aiokafka = "^0.10"
python-dotenv = "^1.0"
httpx = "^0.27"
tenacity = "^8.2"
orjson = "^3.10"
structlog = "^24.1"
opentelemetry-sdk = "^1.24"
opentelemetry-exporter-otlp = "^1.24"
pyyaml = "^6.0"
jinja2 = "^3.1"
pymupdf = "^1.24"
python-docx = "^1.1"
pillow = "^12.3.0"

[tool.poetry.group.dev.dependencies]
pytest = "^8.2"
pytest-asyncio = "^0.23"
pytest-cov = "^5.0"
pytest-mock = "^3.14"
ruff = "^0.4"
mypy = "^1.10"
black = "^24.4"
pre-commit = "^3.7"
faker = "^25.0"
respx = "^0.21"
jsonschema = "^4.22"

[tool.poetry.scripts]
label-agent = "label_agent.main:main"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.black]
line-length = 100
target-version = ["py310"]

[tool.ruff]
line-length = 100
target-version = "py310"
src = ["src", "tests"]
extend-exclude = ["*.feem_backup_*"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.10"
packages = ["label_agent"]
mypy_path = "src"
strict_optional = true
ignore_missing_imports = true
exclude = '(^|[\\/]).*\.feem_backup_.*\.py$'

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "-ra -q --cov=src/label_agent --cov-report=term-missing --ignore-glob=*.feem_backup_*.py"
